name: Publish develop to Play internal testing

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# Finish an in-flight Play edit before starting another upload.
concurrency:
  group: play-internal
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: play-internal
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Run credential-script tests, app tests, and lint
        run: |
          python3 -I -m unittest discover -s ci -p 'test_*.py'
          ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --no-configuration-cache --console=plain
      - name: Prepare private publishing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 -I ci/prepare_play_credentials.py
      - name: Publish signed bundle to internal testing
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/londontrainer-play/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/londontrainer-play/service-account.json
        run: >-
          ./gradlew :app:publishReleaseBundle --track internal
          --release-name "develop ${GITHUB_SHA:0:12}"
          -PrequirePlaySigning=true --no-daemon --no-configuration-cache --console=plain
      - name: Retain test reports and uploaded bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-internal-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/outputs/bundle/release/*.aab
      - name: Remove private publishing files
        if: always()
        run: python3 -I ci/prepare_play_credentials.py --clean
